<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타로 리딩 — 2days 웰니스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Nanum+Myeongjo:wght@400;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Font override for tarot page ── */
    .tarot-page {
      --font: 'Nanum Myeongjo', 'Noto Serif KR', serif;
    }

    /* ── Tarot Scene ── */
    .tarot-scene {
      position: relative;
      min-height: 340px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 0;
    }
    .tarot-scene-bg {
      position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1600565193348-f74bd3c7ccdf?w=1200&q=80') center/cover no-repeat;
      filter: brightness(0.35) saturate(0.7);
    }
    .tarot-scene-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(7,7,15,0.2) 0%, rgba(7,7,15,0.8) 70%, rgba(7,7,15,1) 100%);
    }
    .tarot-scene-content {
      position: relative; z-index: 2;
      text-align: center; padding: 0 20px 32px;
      width: 100%;
    }
    .tarot-scene-subtitle {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: #c084fc; margin-bottom: 12px; font-family: 'Cinzel', serif;
      opacity: 0.9;
    }
    .tarot-scene-title {
      font-size: clamp(26px, 5.5vw, 42px);
      font-weight: 900; color: #fff;
      font-family: 'Noto Serif KR', serif;
      line-height: 1.3; margin-bottom: 12px;
      text-shadow: 0 2px 30px rgba(168,85,247,0.6);
    }
    .tarot-scene-desc {
      font-size: 14px; color: rgba(255,255,255,0.7);
      max-width: 440px; margin: 0 auto;
      font-family: 'Nanum Myeongjo', serif;
      line-height: 1.8; letter-spacing: 0.3px;
    }

    /* ── Spread Selector ── */
    .tarot-setup-wrap {
      max-width: 600px; margin: 0 auto; padding: 24px 16px;
    }
    .spread-selector {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; margin-bottom: 20px;
    }
    @media(min-width:480px){ .spread-selector { grid-template-columns: repeat(4,1fr); } }
    .spread-btn {
      background: rgba(168,85,247,0.06); border: 1px solid rgba(168,85,247,0.18);
      border-radius: 14px; padding: 16px 10px; cursor: pointer;
      transition: all .25s; text-align: center; color: var(--txt);
      font-family: 'Nanum Myeongjo', serif;
    }
    .spread-btn:hover {
      background: rgba(168,85,247,0.14); border-color: rgba(168,85,247,0.5);
      transform: translateY(-3px); box-shadow: 0 6px 24px rgba(168,85,247,0.25);
    }
    .spread-btn.active {
      background: rgba(168,85,247,0.18); border-color: #a855f7;
      transform: translateY(-2px); box-shadow: 0 4px 20px rgba(168,85,247,0.35);
    }
    .spread-btn-icon { font-size: 24px; margin-bottom: 8px; }
    .spread-btn-name { font-size: 13px; font-weight: 700; display: block; font-family: 'Noto Serif KR', serif; }
    .spread-btn-sub  { font-size: 11px; color: var(--txt-muted); display: block; margin-top: 3px; font-family: 'Nanum Myeongjo', serif; }

    .tarot-question-input {
      width: 100%; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 12px;
      color: var(--txt); font-size: 14px; padding: 14px 16px;
      font-family: 'Nanum Myeongjo', serif; margin-bottom: 14px;
      box-sizing: border-box; outline: none;
    }
    .tarot-question-input:focus { border-color: #a855f7; }
    .tarot-draw-btn {
      width: 100%; background: linear-gradient(135deg, #6d28d9, #a855f7, #c084fc);
      color: #fff; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700; padding: 17px;
      cursor: pointer; transition: all .25s; font-family: 'Noto Serif KR', serif;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(168,85,247,0.4), 0 0 0 1px rgba(168,85,247,0.3);
    }
    .tarot-draw-btn:hover {
      opacity: 0.92; transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(168,85,247,0.5), 0 0 0 1px rgba(168,85,247,0.4);
    }

    /* ── Fan Card Stage ── */
    .fan-stage {
      position: relative; padding: 0 20px 40px;
      min-height: 300px;
    }
    .fan-hint {
      text-align: center; font-size: 14px; color: rgba(192,132,252,0.85);
      margin-bottom: 20px; animation: pulse 2s ease-in-out infinite;
      font-family: 'Nanum Myeongjo', serif; letter-spacing: 0.3px;
    }
    @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }

    .fan-container {
      position: relative;
      height: 260px;
      display: flex; align-items: flex-end; justify-content: center;
    }

    /* Reader + hand scene */
    .tarot-reader-scene {
      position: relative;
      max-width: 700px; margin: 0 auto 16px;
      padding: 0 16px;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 12px;
    }
    .reader-figure {
      width: 90px; height: 150px; flex-shrink: 0;
      border-radius: 12px; overflow: hidden;
      background: url('https://images.unsplash.com/photo-1594736797933-d0401ba6dcce?w=300&q=80') center top/cover no-repeat;
      box-shadow: 0 0 30px rgba(168,85,247,0.3);
      opacity: 0.85;
    }
    @media(max-width:500px){ .reader-figure { width:60px; height:110px; } }

    .hand-figure {
      width: 80px; height: 130px; flex-shrink: 0;
      border-radius: 12px; overflow: hidden;
      background: url('https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=300&q=80') center bottom/cover no-repeat;
      box-shadow: 0 0 30px rgba(168,85,247,0.2);
      opacity: 0.75;
    }
    @media(max-width:500px){ .hand-figure { width:60px; height:110px; } }

    .fan-cards-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 320px;
      overflow: visible;
      /* cards are absolute-positioned children */
    }

    /* Individual fan cards */
    .fan-card {
      position: absolute;
      bottom: 0;
      width: 70px; height: 120px;
      background: linear-gradient(135deg, #2a0f6e 0%, #4c1d95 50%, #1e0a4a 100%);
      border: 2px solid rgba(168,85,247,0.4);
      border-radius: 8px;
      cursor: pointer;
      transform-origin: bottom center;
      transition: transform .3s ease, box-shadow .3s ease, filter .3s ease;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      user-select: none;
    }
    .fan-card::before {
      content: '';
      position: absolute; inset: 4px;
      border: 1px solid rgba(168,85,247,0.3);
      border-radius: 4px;
    }
    .fan-card::after {
      content: '✦';
      color: rgba(168,85,247,0.6); font-size: 18px;
    }
    .fan-card:hover {
      transform: var(--fan-rotate) translateY(-20px) scale(1.08) !important;
      box-shadow: 0 12px 35px rgba(168,85,247,0.5), 0 0 20px rgba(168,85,247,0.3);
      filter: brightness(1.3);
      z-index: 50 !important;
    }
    .fan-card.selected {
      filter: brightness(1.5);
      box-shadow: 0 0 30px rgba(168,85,247,0.8);
    }
    .fan-card.dimmed {
      opacity: 0.4; pointer-events: none;
    }

    /* Revealed card (real image) */
    .revealed-card {
      display: none;
      flex-direction: column; align-items: center;
      padding: 20px 16px 0;
    }
    .revealed-card.active { display: flex; }

    .real-card-img-wrap {
      width: 120px; height: 220px;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(168,85,247,0.5);
      margin-bottom: 12px;
      position: relative;
    }
    .real-card-img-wrap.reversed { transform: rotate(180deg); }
    .real-card-img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .3s ease;
    }
    .card-reveal-anim {
      animation: cardReveal 0.6s ease-out;
    }
    @keyframes cardReveal {
      0% { transform: rotateY(90deg) scale(0.8); opacity: 0; }
      100% { transform: rotateY(0) scale(1); opacity: 1; }
    }

    /* Meaning panel */
    .card-meaning-panel { max-width: 640px; margin: 0 auto; padding: 0 16px; }
    .card-meaning-card {
      background: var(--bg-card); border: 1px solid rgba(168,85,247,0.2);
      border-radius: 16px; padding: 20px; margin-bottom: 14px;
    }
    .cmc-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
    }
    .cmc-img {
      width: 60px; height: 100px; border-radius: 8px; overflow: hidden;
      flex-shrink: 0; box-shadow: 0 4px 20px rgba(168,85,247,0.4);
    }
    .cmc-img img { width: 100%; height: 100%; object-fit: cover; }
    .cmc-img.rev img { transform: rotate(180deg); }
    .cmc-meta { flex: 1; }
    .cmc-pos { font-size: 10px; color: #c084fc; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; font-family: 'Cinzel', serif; }
    .cmc-name { font-size: 18px; font-weight: 700; color: var(--txt); margin-bottom: 2px; font-family: 'Noto Serif KR', serif; }
    .cmc-en { font-size: 11px; color: var(--txt-muted); font-family: 'Cinzel', serif; letter-spacing: 0.5px; }
    .cmc-orientation {
      font-size: 11px; padding: 3px 10px; border-radius: 20px;
      display: inline-block; margin-top: 7px; font-weight: 700;
      font-family: 'Nanum Myeongjo', serif; letter-spacing: 0.5px;
    }
    .cmc-orientation.upright { background: rgba(52,211,153,0.12); color: #34d399; border: 1px solid rgba(52,211,153,0.25); }
    .cmc-orientation.reversed { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.25); }
    .cmc-keywords { font-size: 12.5px; color: #c084fc; margin-bottom: 10px; font-family: 'Nanum Myeongjo', serif; line-height: 1.6; }
    .cmc-detail { font-size: 14px; color: var(--txt-muted); line-height: 1.9; font-family: 'Nanum Myeongjo', serif; }

    .overall-reading {
      max-width: 640px; margin: 20px auto; padding: 0 16px;
      background: linear-gradient(135deg, rgba(168,85,247,0.08), rgba(129,140,248,0.08));
      border: 1px solid rgba(168,85,247,0.2); border-radius: 16px;
    }
    .or-title { font-size: 13px; font-weight: 700; color: #c084fc; padding: 18px 20px 8px; font-family: 'Cinzel', serif; letter-spacing: 1px; }
    .or-body { font-size: 14px; color: var(--txt-muted); line-height: 2; padding: 0 20px 22px; font-family: 'Nanum Myeongjo', serif; }

    .tarot-again-btn {
      display: block; margin: 24px auto 40px;
      background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.3);
      color: #c084fc; border-radius: 14px; padding: 14px 36px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all .25s; font-family: 'Noto Serif KR', serif;
      letter-spacing: 1px;
    }
    .tarot-again-btn:hover { background: rgba(168,85,247,0.18); transform: translateY(-1px); }

    /* Phase containers */
    #phaseFan, #phaseMeaning { animation: fadeIn .4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body class="tarot-page">
  <canvas id="starsBg"></canvas>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-sym">◈</span>
        <span class="logo-text">2days 웰니스</span>
      </a>
      <nav class="page-nav">
        <a href="saju.html"       class="pn-link">사주</a>
        <a href="tarot.html"      class="pn-link active">타로</a>
        <a href="meditation.html" class="pn-link">명상</a>
        <a href="yoga.html"       class="pn-link">요가</a>
        <a href="dream.html"      class="pn-link">꿈해몽</a>
        <a href="fortune.html"    class="pn-link">운세</a>
      </nav>
    </div>
  </header>

  <!-- Phase 1: Intro + Spread selector -->
  <div id="phaseIntro">
    <div class="tarot-scene">
      <div class="tarot-scene-bg"></div>
      <div class="tarot-scene-overlay"></div>
      <div class="tarot-scene-content">
        <div class="tarot-scene-subtitle">✦ Tarot Reading ✦</div>
        <h1 class="tarot-scene-title">카드가 전하는<br/>신비로운 메시지</h1>
        <p class="tarot-scene-desc">마음속 깊은 질문을 떠올리고<br/>당신의 운명을 펼쳐보세요</p>
      </div>
    </div>

    <div class="tarot-setup-wrap">
      <div style="font-size:13px;color:var(--txt-muted);margin-bottom:14px;text-align:center;font-family:'Nanum Myeongjo',serif;letter-spacing:0.5px">스프레드를 선택하세요</div>
      <div class="spread-selector" id="spreadSelector">
        <button class="spread-btn active" data-spread="1">
          <div class="spread-btn-icon">🔮</div>
          <span class="spread-btn-name">오늘의 한 장</span>
          <span class="spread-btn-sub">즉각적인 통찰</span>
        </button>
        <button class="spread-btn" data-spread="3">
          <div class="spread-btn-icon">🃏</div>
          <span class="spread-btn-name">과거·현재·미래</span>
          <span class="spread-btn-sub">3장 스프레드</span>
        </button>
        <button class="spread-btn" data-spread="7">
          <div class="spread-btn-icon">🌟</div>
          <span class="spread-btn-name">말굽 스프레드</span>
          <span class="spread-btn-sub">7장 심층 분석</span>
        </button>
        <button class="spread-btn" data-spread="10">
          <div class="spread-btn-icon">✨</div>
          <span class="spread-btn-name">켈틱 십자가</span>
          <span class="spread-btn-sub">10장 완전 분석</span>
        </button>
      </div>

      <input id="questionInput" class="tarot-question-input"
        type="text" placeholder="마음속 질문을 입력하세요 (선택사항)" maxlength="80" autocomplete="off" />
      <button class="tarot-draw-btn" id="drawBtn">✦ 카드 펼치기 시작 ✦</button>
    </div>
  </div>

  <!-- Phase 2: Fan of cards -->
  <div id="phaseFan" style="display:none">
    <div class="fan-hint" id="fanHint">카드에 손을 올리고 직관을 따라 선택하세요</div>

    <!-- Reader scene -->
    <div class="tarot-reader-scene">
      <div class="reader-figure"></div>
      <div class="fan-cards-wrap" id="fanCardsWrap"></div>
      <div class="hand-figure"></div>
    </div>

    <p style="text-align:center;font-size:13px;color:var(--txt-muted);padding:8px 20px 0;font-family:'Nanum Myeongjo',serif">
      남은 카드: <strong id="remainCount" style="color:#c084fc">-</strong> &ensp;·&ensp;
      선택: <strong id="selectedCount" style="color:#34d399">0</strong>
    </p>
  </div>

  <!-- Phase 3: Meaning -->
  <div id="phaseMeaning" style="display:none">
    <div style="text-align:center;padding:32px 20px 18px">
      <div style="font-size:11px;letter-spacing:3px;color:#c084fc;margin-bottom:10px;font-family:'Cinzel',serif">READING RESULT</div>
      <h2 style="font-size:24px;font-weight:900;color:var(--txt);margin-bottom:8px;font-family:'Noto Serif KR',serif" id="meaningTitle">리딩 결과</h2>
      <p style="font-size:14px;color:var(--txt-muted);font-family:'Nanum Myeongjo',serif;line-height:1.7" id="meaningQuestion"></p>
    </div>
    <div class="card-meaning-panel" id="meaningPanel"></div>
    <div class="overall-reading" id="overallReading"></div>
    <button class="tarot-again-btn" id="againBtn">↺ 새로운 리딩</button>
  </div>

  <div class="toast" id="toast"></div>
  <nav class="bottom-nav">
    <a href="index.html" class="bn-item"><span class="bn-icon">◈</span><span class="bn-label">홈</span></a>
    <a href="saju.html" class="bn-item"><span class="bn-icon">☯</span><span class="bn-label">사주</span></a>
    <a href="tarot.html" class="bn-item active"><span class="bn-icon">🃏</span><span class="bn-label">타로</span></a>
    <a href="meditation.html" class="bn-item"><span class="bn-icon">🧘</span><span class="bn-label">명상</span></a>
    <a href="yoga.html" class="bn-item"><span class="bn-icon">🌿</span><span class="bn-label">요가</span></a>
    <a href="dream.html" class="bn-item"><span class="bn-icon">🌙</span><span class="bn-label">꿈해몽</span></a>
    <a href="fortune.html" class="bn-item"><span class="bn-icon">⭐</span><span class="bn-label">운세</span></a>
  </nav>
  <script src="stars.js"></script>
  <script src="tarot.js"></script>
</body>
</html>
