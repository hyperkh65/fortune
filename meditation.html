<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="호흡과 마음챙김으로 내면의 평화를 찾아가는 명상 타이머." />
  <title>명상 — 2days 웰니스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Meditation Hero ── */
    .med-hero {
      position: relative; height: 260px;
      display: flex; align-items: flex-end; justify-content: center;
      overflow: hidden;
    }
    .med-hero-bg {
      position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=1200&q=80') center/cover no-repeat;
      filter: brightness(0.4);
      transition: background-image 0.8s ease;
    }
    .med-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(7,7,15,0.1), rgba(7,7,15,0.85));
    }
    .med-hero-text {
      position: relative; z-index: 2;
      text-align: center; padding: 0 20px 24px;
    }
    .med-hero-eyebrow { font-size: 11px; letter-spacing: 3px; color: #60a5fa; margin-bottom: 8px; }
    .med-hero-title { font-size: clamp(22px, 5vw, 32px); font-weight: 900; color: #fff; font-family: 'Noto Serif KR', serif; }

    /* Sound cards with real images */
    .med-sound-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 16px;
    }
    @media(min-width:500px){ .med-sound-grid { grid-template-columns: repeat(5, 1fr); } }
    @media(min-width:700px){ .med-sound-grid { grid-template-columns: repeat(9, 1fr); } }

    .med-sound-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; cursor: pointer;
      transition: all .2s; position: relative; padding: 0;
      aspect-ratio: 1;
    }
    .med-sound-btn.active {
      border-color: #60a5fa;
      box-shadow: 0 0 16px rgba(96,165,250,0.3);
    }
    .med-sound-img {
      width: 100%; height: 60px; object-fit: cover;
      display: block;
    }
    .med-sound-no-img {
      width: 100%; height: 60px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; background: rgba(96,165,250,0.08);
    }
    .med-sound-label-wrap {
      padding: 5px 4px;
      text-align: center;
    }
    .med-sound-name { font-size: 11px; color: var(--txt-muted); display: block; }
    .med-sound-btn.active .med-sound-name { color: #60a5fa; font-weight: 600; }

    /* Volume control */
    .med-volume-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;
    }
    .med-vol-icon { font-size: 18px; }
    .med-volume-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 4px; border-radius: 2px;
      background: linear-gradient(to right, #60a5fa 0%, #60a5fa var(--vol, 50%), rgba(255,255,255,0.15) var(--vol, 50%), rgba(255,255,255,0.15) 100%);
      outline: none; cursor: pointer;
    }
    .med-volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #60a5fa;
      box-shadow: 0 0 8px rgba(96,165,250,0.5);
    }
    .med-vol-pct { font-size: 12px; color: #60a5fa; min-width: 32px; text-align: right; }

    /* Active bg per sound */
    body.sound-ocean    .med-hero-bg { background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80'); }
    body.sound-forest   .med-hero-bg { background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=80'); }
    body.sound-rain     .med-hero-bg { background-image: url('https://images.unsplash.com/photo-1498496294664-d4f87d90d666?w=1200&q=80'); }
    body.sound-temple   .med-hero-bg { background-image: url('https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=1200&q=80'); }
    body.sound-fire     .med-hero-bg { background-image: url('https://images.unsplash.com/photo-1486974914048-c4d9d984d9f1?w=1200&q=80'); }
    body.sound-wind     .med-hero-bg { background-image: url('https://images.unsplash.com/photo-1504701954957-2010ec3bcec1?w=1200&q=80'); }
    body.sound-healing  .med-hero-bg { background-image: url('https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?w=1200&q=80'); }
    body.sound-white    .med-hero-bg { background-image: url('https://images.unsplash.com/photo-1542281286-9e0a16bb7366?w=1200&q=80'); }
  </style>
</head>
<body class="med-page">
  <canvas id="starsBg"></canvas>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-sym">✦</span>
        <span class="logo-text">2days 웰니스</span>
      </a>
      <nav class="page-nav">
        <a href="saju.html"       class="pn-link">사주</a>
        <a href="tarot.html"      class="pn-link">타로</a>
        <a href="meditation.html" class="pn-link active">명상</a>
        <a href="yoga.html"       class="pn-link">요가</a>
        <a href="dream.html"      class="pn-link">꿈해몽</a>
        <a href="fortune.html"    class="pn-link">운세</a>
      </nav>
    </div>
  </header>

  <!-- Hero with dynamic background -->
  <div class="med-hero">
    <div class="med-hero-bg" id="medHeroBg"></div>
    <div class="med-hero-overlay"></div>
    <div class="med-hero-text">
      <div class="med-hero-eyebrow">✦ MEDITATION TIMER ✦</div>
      <h1 class="med-hero-title">지금 이 순간에 머무세요</h1>
    </div>
  </div>

  <div class="med-wrap">

    <!-- Breathing type -->
    <div class="med-type-grid" id="typeGrid">
      <button class="med-type-btn active" data-type="breath">
        <div class="med-type-icon">🌬️</div>
        <div class="med-type-name">호흡 명상</div>
        <div class="med-type-sub">4-4 리듬 호흡</div>
      </button>
      <button class="med-type-btn" data-type="box">
        <div class="med-type-icon">📦</div>
        <div class="med-type-name">박스 호흡</div>
        <div class="med-type-sub">4-4-4-4 사각호흡</div>
      </button>
      <button class="med-type-btn" data-type="478">
        <div class="med-type-icon">🌙</div>
        <div class="med-type-name">4-7-8 호흡</div>
        <div class="med-type-sub">수면·이완 호흡</div>
      </button>
      <button class="med-type-btn" data-type="open">
        <div class="med-type-icon">🧘</div>
        <div class="med-type-name">자유 명상</div>
        <div class="med-type-sub">호흡 안내 없음</div>
      </button>
    </div>

    <!-- Duration -->
    <div class="med-duration-row" id="durRow">
      <button class="med-dur-btn" data-min="5">5분</button>
      <button class="med-dur-btn active" data-min="10">10분</button>
      <button class="med-dur-btn" data-min="15">15분</button>
      <button class="med-dur-btn" data-min="20">20분</button>
    </div>

    <!-- Sound theme with real images -->
    <div class="med-sound-section">
      <p class="med-sound-label">🎵 배경 소리</p>
      <div class="med-sound-grid" id="soundGrid">
        <button class="med-sound-btn active" data-sound="none">
          <div class="med-sound-no-img">🔇</div>
          <div class="med-sound-label-wrap"><span class="med-sound-name">없음</span></div>
        </button>
        <button class="med-sound-btn" data-sound="ocean">
          <img class="med-sound-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200&q=60" alt="바다" loading="lazy" />
          <div class="med-sound-label-wrap"><span class="med-sound-name">🌊 바다</span></div>
        </button>
        <button class="med-sound-btn" data-sound="forest">
          <img class="med-sound-img" src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=200&q=60" alt="산속" loading="lazy" />
          <div class="med-sound-label-wrap"><span class="med-sound-name">🌲 산속</span></div>
        </button>
        <button class="med-sound-btn" data-sound="rain">
          <img class="med-sound-img" src="https://images.unsplash.com/photo-1498496294664-d4f87d90d666?w=200&q=60" alt="빗소리" loading="lazy" />
          <div class="med-sound-label-wrap"><span class="med-sound-name">🌧️ 빗소리</span></div>
        </button>
        <button class="med-sound-btn" data-sound="temple">
          <img class="med-sound-img" src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=200&q=60" alt="사찰" loading="lazy" />
          <div class="med-sound-label-wrap"><span class="med-sound-name">🏯 사찰</span></div>
        </button>
        <button class="med-sound-btn" data-sound="fire">
          <img class="med-sound-img" src="https://images.unsplash.com/photo-1486974914048-c4d9d984d9f1?w=200&q=60" alt="벽난로" loading="lazy" />
          <div class="med-sound-label-wrap"><span class="med-sound-name">🔥 벽난로</span></div>
        </button>
        <button class="med-sound-btn" data-sound="wind">
          <img class="med-sound-img" src="https://images.unsplash.com/photo-1504701954957-2010ec3bcec1?w=200&q=60" alt="바람" loading="lazy" />
          <div class="med-sound-label-wrap"><span class="med-sound-name">💨 바람</span></div>
        </button>
        <button class="med-sound-btn" data-sound="healing">
          <img class="med-sound-img" src="https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?w=200&q=60" alt="치유" loading="lazy" />
          <div class="med-sound-label-wrap"><span class="med-sound-name">✨ 432Hz</span></div>
        </button>
        <button class="med-sound-btn" data-sound="white">
          <img class="med-sound-img" src="https://images.unsplash.com/photo-1542281286-9e0a16bb7366?w=200&q=60" alt="백색소음" loading="lazy" />
          <div class="med-sound-label-wrap"><span class="med-sound-name">📻 백색소음</span></div>
        </button>
      </div>

      <!-- Volume control -->
      <div class="med-volume-row">
        <span class="med-vol-icon">🔈</span>
        <input type="range" id="volumeSlider" class="med-volume-slider"
               min="0" max="1" step="0.01" value="0.5" />
        <span class="med-vol-icon">🔊</span>
        <span class="med-vol-pct" id="volPct">50%</span>
      </div>
    </div>

    <!-- Timer -->
    <div class="med-timer-area">
      <div class="med-ring-wrap">
        <svg class="med-ring-svg" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#60a5fa"/>
              <stop offset="100%" stop-color="#818cf8"/>
            </linearGradient>
          </defs>
          <circle class="med-ring-bg" cx="50" cy="50" r="44"/>
          <circle class="med-ring-fill" id="ringFill" cx="50" cy="50" r="44"
            stroke-dasharray="276.46" stroke-dashoffset="0"/>
        </svg>
        <div class="med-ring-center">
          <div class="med-time-display" id="timeDisplay">10:00</div>
          <div class="med-phase-label" id="phaseLabel">준비</div>
        </div>
      </div>

      <div class="med-breath-wrap" id="breathWrap">
        <div class="med-breath-ring" id="breathRing"></div>
        <div class="med-breath-core" id="breathCore"></div>
      </div>
      <p class="med-breath-text" id="breathText">시작 버튼을 눌러 명상을 시작하세요</p>

      <div class="med-ctrl-row">
        <button class="med-reset-btn" id="resetBtn" title="초기화">↺</button>
        <button class="med-start-btn" id="startBtn">▶</button>
        <button class="med-reset-btn" id="skipBtn" title="완료 처리">⏭</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="med-stats">
      <div class="med-stat-card">
        <div class="med-stat-val" id="statSessions">0</div>
        <div class="med-stat-label">오늘 세션</div>
      </div>
      <div class="med-stat-card">
        <div class="med-stat-val" id="statMinutes">0</div>
        <div class="med-stat-label">총 명상 분</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="bottom-nav">
    <a href="index.html" class="bn-item"><span class="bn-icon">🏠</span><span class="bn-label">홈</span></a>
    <a href="saju.html" class="bn-item"><span class="bn-icon">☯</span><span class="bn-label">사주</span></a>
    <a href="tarot.html" class="bn-item"><span class="bn-icon">🃏</span><span class="bn-label">타로</span></a>
    <a href="meditation.html" class="bn-item active"><span class="bn-icon">🧘</span><span class="bn-label">명상</span></a>
    <a href="yoga.html" class="bn-item"><span class="bn-icon">🌿</span><span class="bn-label">요가</span></a>
    <a href="dream.html" class="bn-item"><span class="bn-icon">🌙</span><span class="bn-label">꿈해몽</span></a>
    <a href="fortune.html" class="bn-item"><span class="bn-icon">⭐</span><span class="bn-label">운세</span></a>
  </nav>
  <script src="stars.js"></script>
  <script src="meditation.js"></script>
</body>
</html>
