<head>

<body class="yoga-page">
  <canvas id="starsBg"></canvas>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-sym">◈</span>
        <span class="logo-text">2days 웰니스</span>
      </a>
      <nav class="page-nav">
        <a href="saju.html"       class="pn-link">사주</a>
        <a href="tarot.html"      class="pn-link">타로</a>
        <a href="meditation.html" class="pn-link">명상</a>
        <a href="yoga.html"       class="pn-link active">요가</a>

        <a href="fortune.html"    class="pn-link">운세</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <div style="position:relative;height:220px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center">
    <div style="position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1545389336-cf090694435e?w=1200&q=80') center/cover no-repeat;filter:brightness(0.4)"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent,rgba(7,7,15,0.95))"></div>
    <div style="position:relative;z-index:2;text-align:center;padding:0 20px 24px">
      <div style="font-size:11px;letter-spacing:3px;color:#fb923c;margin-bottom:8px">✦ YOGA GUIDE ✦</div>
      <h1 class="yoga-title" style="font-size:clamp(22px,5vw,32px);font-weight:900;color:#fff;font-family:'Noto Serif KR',serif;margin:0 0 8px">몸과 마음을 연결하세요</h1>
      <p style="font-size:13px;color:rgba(255,255,255,0.65)">단계별 지침과 YouTube 영상으로 안전하게 요가를 시작하세요</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="yoga-filter-section">
    <p class="yoga-filter-label">난이도</p>
    <div class="yoga-filter-row" id="levelFilter">
      <button class="yoga-filter-btn active" data-level="all">전체</button>
      <button class="yoga-filter-btn" data-level="beginner">초급</button>
      <button class="yoga-filter-btn" data-level="middle">중급</button>
      <button class="yoga-filter-btn" data-level="advanced">고급</button>
    </div>

    <p class="yoga-filter-label">효과</p>
    <div class="yoga-filter-row" id="benefitFilter">
      <button class="yoga-filter-btn active" data-benefit="all">전체</button>
      <button class="yoga-filter-btn" data-benefit="flexibility">유연성</button>
      <button class="yoga-filter-btn" data-benefit="strength">근력</button>
      <button class="yoga-filter-btn" data-benefit="balance">균형</button>
      <button class="yoga-filter-btn" data-benefit="stress">스트레스 해소</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="yoga-grid-wrap">
    <div class="yoga-grid" id="yogaGrid"></div>
  </div>

  <nav class="bottom-nav">

    <a href="dream.html" class="bn-item"><span class="bn-icon">🌙</span><span class="bn-label">꿈해몽</span></a>
    <a href="fortune.html" class="bn-item"><span class="bn-icon">⭐</span><span class="bn-label">운세</span></a>
