<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타로 리딩 — AI Wellness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="tarot-page">
  <canvas id="starsBg"></canvas>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-sym">◈</span>
        <span class="logo-text">AI Wellness</span>
      </a>
      <nav class="page-nav">
        <a href="saju.html"       class="pn-link">사주</a>
        <a href="tarot.html"      class="pn-link active">타로</a>
        <a href="meditation.html" class="pn-link">명상</a>
        <a href="yoga.html"       class="pn-link">요가</a>
        <a href="dream.html"      class="pn-link">꿈해몽</a>
        <a href="fortune.html"    class="pn-link">운세</a>
      </nav>
    </div>
  </header>

  <div class="tarot-intro" id="tarotIntro">
    <p class="tarot-eyebrow">✦ 타로 리딩</p>
    <h1 class="tarot-title">카드가 전하는 메시지</h1>
    <p style="font-size:14px;color:var(--txt-muted);margin-bottom:24px">마음속 질문을 떠올리고 카드를 선택하세요</p>

    <div class="spread-selector" id="spreadSelector">
      <button class="spread-btn active" data-spread="1">
        <span class="spread-btn-icon">🔮</span>
        <span class="spread-btn-name">오늘의 한 장</span>
        <span class="spread-btn-sub">빠른 통찰</span>
      </button>
      <button class="spread-btn" data-spread="3">
        <span class="spread-btn-icon">🃏</span>
        <span class="spread-btn-name">과거·현재·미래</span>
        <span class="spread-btn-sub">3장 스프레드</span>
      </button>
      <button class="spread-btn" data-spread="7">
        <span class="spread-btn-icon">🌟</span>
        <span class="spread-btn-name">말굽 스프레드</span>
        <span class="spread-btn-sub">7장 심층 분석</span>
      </button>
      <button class="spread-btn" data-spread="10">
        <span class="spread-btn-icon">✨</span>
        <span class="spread-btn-name">켈틱 십자가</span>
        <span class="spread-btn-sub">10장 완전 분석</span>
      </button>
    </div>
  </div>

  <div class="tarot-question-wrap" id="tarotQWrap">
    <input id="questionInput" class="tarot-question-input"
      type="text" placeholder="마음속 질문을 입력하세요 (선택사항)" maxlength="80" autocomplete="off" />
    <button class="tarot-draw-btn" id="drawBtn">카드 뽑기 시작</button>
  </div>

  <div id="phaseDeck" style="display:none">
    <p class="deck-hint">아래 덱을 클릭하여 카드를 펼치세요</p>
    <div class="deck-area">
      <div class="deck-stack" id="deckStack">
        <div class="deck-card-layer">✦</div>
        <div class="deck-card-layer">✦</div>
        <div class="deck-card-layer">✦</div>
      </div>
    </div>
  </div>

  <div id="phaseSpread" style="display:none">
    <p class="deck-hint" id="spreadHint">카드를 한 장씩 클릭하여 공개하세요</p>
    <div id="cardSpread"></div>
  </div>

  <div id="phaseMeaning" style="display:none">
    <div class="meaning-header">
      <h2 class="meaning-title" id="meaningTitle">리딩 결과</h2>
      <p class="meaning-question" id="meaningQuestion"></p>
    </div>
    <div class="card-meaning-panel" id="meaningPanel"></div>
    <div class="overall-reading" id="overallReading"></div>
    <button class="tarot-again-btn" id="againBtn">↺ 새로운 리딩</button>
  </div>

  <div class="toast" id="toast"></div>
  <nav class="bottom-nav">
    <a href="index.html" class="bn-item"><span class="bn-icon">◈</span><span class="bn-label">홈</span></a>
    <a href="saju.html" class="bn-item"><span class="bn-icon">☯</span><span class="bn-label">사주</span></a>
    <a href="tarot.html" class="bn-item active"><span class="bn-icon">🃏</span><span class="bn-label">타로</span></a>
    <a href="meditation.html" class="bn-item"><span class="bn-icon">🧘</span><span class="bn-label">명상</span></a>
    <a href="yoga.html" class="bn-item"><span class="bn-icon">🌿</span><span class="bn-label">요가</span></a>
    <a href="dream.html" class="bn-item"><span class="bn-icon">🌙</span><span class="bn-label">꿈해몽</span></a>
    <a href="fortune.html" class="bn-item"><span class="bn-icon">⭐</span><span class="bn-label">운세</span></a>
  </nav>
  <script src="stars.js"></script>
  <script src="tarot.js"></script>
</body>
</html>
